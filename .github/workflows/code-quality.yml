name: Code quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install API test dependencies
        run: python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'psycopg[binary]>=3,<4' 'SQLAlchemy>=2,<3' 'python-dotenv>=1,<2' 'PyJWT[crypto]>=2.9,<3'
      - name: Check Python syntax
        run: python -m compileall -q api scoutmonitor scripts tests
      - name: Run automated tests
        run: python -m unittest discover -s tests -v

  database:
    name: PostgreSQL migration and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: scoutmonitor_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scoutmonitor_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SCOUTMONITOR_DATABASE_URL: postgresql+psycopg://postgres:integration-only@127.0.0.1:5432/scoutmonitor_ci
      SCOUTMONITOR_MIGRATION_DATABASE: scoutmonitor_ci
      SCOUTMONITOR_RUN_DB_TESTS: "1"
      SCOUTMONITOR_PRIVATE_DATABASE_URL: postgresql+psycopg://scoutmonitor_runtime:ci-runtime-only@127.0.0.1:5432/scoutmonitor_ci
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install database tools
        run: python -m pip install 'SQLAlchemy>=2,<3' 'alembic>=1.13,<2' 'psycopg[binary]>=3,<4' 'python-dotenv>=1,<2' 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'PyJWT[crypto]>=2.9,<3'
      - name: Create schema through Alembic
        run: python -m alembic -c alembic.ini upgrade head
      - name: Verify migrations can be rerun safely
        run: python -m alembic -c alembic.ini upgrade head
      - name: Create restricted application database role
        env:
          PGPASSWORD: integration-only
        run: |
          psql -h 127.0.0.1 -U postgres -d scoutmonitor_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE scoutmonitor_runtime LOGIN PASSWORD 'ci-runtime-only';
          GRANT CONNECT ON DATABASE scoutmonitor_ci TO scoutmonitor_runtime;
          GRANT USAGE ON SCHEMA public TO scoutmonitor_runtime;
          GRANT SELECT ON organizations, organization_memberships, identity_users, players TO scoutmonitor_runtime;
          GRANT SELECT, INSERT ON organization_scouting_notes TO scoutmonitor_runtime;
          SQL
      - name: Test PostgreSQL constraints and organization isolation
        run: python -m unittest discover -s integration_tests -v

  runtime:
    name: Complete runtime dependency check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install complete runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Import application libraries
        run: |
          python -c "import fastapi, streamlit, langgraph, langchain_google_genai, psycopg, sqlalchemy, alembic, jwt"
          python -c "import api.main; import scripts.monitor_logic"
