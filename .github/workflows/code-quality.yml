name: Code quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install API test dependencies
        run: python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1'
      - name: Check Python syntax
        run: python -m compileall -q api scoutmonitor scripts tests
      - name: Run automated tests
        run: python -m unittest discover -s tests -v

  database:
    name: PostgreSQL migration and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: scoutmonitor_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scoutmonitor_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SCOUTMONITOR_DATABASE_URL: postgresql+psycopg://postgres:integration-only@127.0.0.1:5432/scoutmonitor_ci
      SCOUTMONITOR_MIGRATION_DATABASE: scoutmonitor_ci
      SCOUTMONITOR_RUN_DB_TESTS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install database tools
        run: python -m pip install 'SQLAlchemy>=2,<3' 'alembic>=1.13,<2' 'psycopg[binary]>=3,<4' 'python-dotenv>=1,<2'
      - name: Create schema through Alembic
        run: python -m alembic -c alembic.ini upgrade head
      - name: Verify migrations can be rerun safely
        run: python -m alembic -c alembic.ini upgrade head
      - name: Test PostgreSQL constraints and report review
        run: python -m unittest discover -s integration_tests -v
