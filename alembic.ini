[alembic]
script_location = %(here)s/db/migrations
prepend_sys_path = .
path_separator = os

# Database credentials are read by db/migrations/env.py from the
# environment or a local .env file. Never commit credentials here.

# Run migrations only against a new, empty, explicitly confirmed database.
# db/migrations/env.py checks SCOUTMONITOR_MIGRATION_DATABASE against
# the actual connection target and refuses legacy manual schemas.
# See docs/database.md before changing migration settings.
